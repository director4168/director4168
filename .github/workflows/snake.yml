name: Generate Snake
on:
  schedule:
    - cron: "0 0 */1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: director4168
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
